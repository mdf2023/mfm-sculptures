<body>
  <a class="skip-link" href="#main">Skip to Content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="wordmark" href="index.html">MFM Sculptures</a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a>

        <a href="commissions.html">Commissions</a>
      </nav>
    </div>

  <main id="main">
    <section class="band" aria-labelledby="page-title">
      <div class="wrap">
        <p class="band__lede">Select a piece to see it from every angle I photographed.</p>
        <h1 class="band__title" id="page-title">Portfolio</h1>
      </div>
    </section>

    <section class="section section--flush">
      <div class="wrap">
        <ul class="tiles pull">
        <li class="tiles__item" id="duck-tile">
          <button class="tile" type="button" data-piece="duck">
            <span class="tile__photo"><img src="img/duck-side-3-800.webp" srcset="img/duck-side-3-800.webp 600w, img/duck-side-3-1600.webp 1200w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1200" height="1600" alt="Duck, side view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Duck</span>
            <span class="tile__made">Spoons</span>
            <span class="tile__count">8 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="eagle-tile">
          <button class="tile" type="button" data-piece="eagle">
            <span class="tile__photo"><img src="img/eagle-right-800.webp" srcset="img/eagle-right-800.webp 600w, img/eagle-right-1600.webp 1200w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1200" height="1600" alt="Bald eagle, right view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Bald Eagle</span>
            <span class="tile__made">Forks, knives, spoons, nuts, bolts, and a brake rotor</span>
            <span class="tile__count">4 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="boat-tile">
          <button class="tile" type="button" data-piece="boat">
            <span class="tile__photo"><img src="img/boat-800.webp" srcset="img/boat-800.webp 600w, img/boat-1600.webp 1200w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1200" height="1600" alt="Fishing boat, three-quarter view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Fishing Boat</span>
            <span class="tile__made">Bolts, nails, wire, and formed sheet metal</span>
            <span class="tile__count">8 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="helicopter-tile">
          <button class="tile" type="button" data-piece="helicopter">
            <span class="tile__photo"><img src="img/helicopter-side-2-800.webp" srcset="img/helicopter-side-2-800.webp 800w, img/helicopter-side-2-1600.webp 1600w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1600" height="1200" alt="Rescue helicopter, side view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Rescue Helicopter</span>
            <span class="tile__made">Nails, sheet metal, and spark plug engines</span>
            <span class="tile__count">8 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="f1-car-tile">
          <button class="tile" type="button" data-piece="f1-car">
            <span class="tile__photo"><img src="img/f1-car-front-2-800.webp" srcset="img/f1-car-front-2-800.webp 800w, img/f1-car-front-2-1600.webp 1600w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1600" height="1200" alt="F1 car, front three-quarter view" loading="lazy" decoding="async"></span>
            <span class="tile__title">F1 Car</span>
            <span class="tile__made">Welded sheet metal, silverware, nuts, and bolts</span>
            <span class="tile__count">5 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="motorcycle-tile">
          <button class="tile" type="button" data-piece="motorcycle">
            <span class="tile__photo"><img src="img/motorcycle-side-800.webp" srcset="img/motorcycle-side-800.webp 800w, img/motorcycle-side-1600.webp 1600w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1600" height="1200" alt="Motorcycle, side view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Motorcycle</span>
            <span class="tile__made">Chain links, a spark plug, a wrench, nails, bolts, and scrap</span>
            <span class="tile__count">5 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="fisherman-tile">
          <button class="tile" type="button" data-piece="fisherman">
            <span class="tile__photo"><img src="img/fisherman-800.webp" srcset="img/fisherman-800.webp 600w, img/fisherman-1600.webp 1200w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1200" height="1600" alt="Fisherman, front view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Fisherman</span>
            <span class="tile__made">Bolts, nails, and washers, on a wooden stand</span>
            <span class="tile__count">2 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="xwing-tile">
          <button class="tile" type="button" data-piece="xwing">
            <span class="tile__photo"><img src="img/xwing-front-3-800.webp" srcset="img/xwing-front-3-800.webp 600w, img/xwing-front-3-1600.webp 1200w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1200" height="1600" alt="X-wing, front three-quarter view from above" loading="lazy" decoding="async"></span>
            <span class="tile__title">X-Wing</span>
            <span class="tile__made">Spark plugs, sheet metal, nails, and a wooden stand</span>
            <span class="tile__count">8 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="longhorns-tile">
          <button class="tile" type="button" data-piece="longhorns">
            <span class="tile__photo"><img src="img/longhorn-front-800.webp" srcset="img/longhorn-front-800.webp 800w, img/longhorn-front-1600.webp 1600w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1600" height="1200" alt="Texas Longhorns logo, front view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Texas Longhorns Logo</span>
            <span class="tile__made">Metal logo on a wooden stand</span>
            
          </button>
        </li>
        <li class="tiles__item" id="chiefs-tile">
          <button class="tile" type="button" data-piece="chiefs">
            <span class="tile__photo"><img src="img/kansas-front-800.webp" srcset="img/kansas-front-800.webp 800w, img/kansas-front-1600.webp 1600w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1600" height="1200" alt="Kansas City Chiefs logo, front view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Kansas City Chiefs Logo</span>
            <span class="tile__made">Metal logo on a wooden stand</span>
            
          </button>
        </li>
        <li class="tiles__item" id="pigs-tile">
          <button class="tile" type="button" data-piece="pigs">
            <span class="tile__photo"><img src="img/pigs-family-front-800.webp" srcset="img/pigs-family-front-800.webp 800w, img/pigs-family-front-1600.webp 1600w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1600" height="1200" alt="Pig family, front view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Pig Family</span>
            <span class="tile__made">Sheet metal, nuts, and bolts</span>
            <span class="tile__count">2 Photos</span>
          </button>
        </li>
        <li class="tiles__item" id="dog-tile">
          <button class="tile" type="button" data-piece="dog">
            <span class="tile__photo"><img src="img/dog-800.webp" srcset="img/dog-800.webp 600w, img/dog-1600.webp 1200w" sizes="(min-width: 1000px) 31vw, (min-width: 600px) 46vw, 92vw" width="1200" height="1600" alt="Dog and fire hydrant, front view" loading="lazy" decoding="async"></span>
            <span class="tile__title">Dog and Fire Hydrant</span>
            <span class="tile__made">Nails, nuts, and bolts</span>
            <span class="tile__count">2 Photos</span>
          </button>
        </li>
        </ul>
      </div>
    </section>

  </footer>
  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer__bar">
      <h2 class="viewer__title" id="viewer-title"></h2>
      <button class="viewer__close" type="button">Close</button>
    </div>
    <div class="viewer__stage">
      <button class="viewer__nav viewer__nav--prev" type="button" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
      </button>
      <img class="viewer__img" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" width="1200" height="900">
      <button class="viewer__nav viewer__nav--next" type="button" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg>
      </button>
    </div>
    <div class="viewer__foot">
      <p class="viewer__caption"></p>
      <p class="viewer__count" aria-live="polite"></p>
    </div>
  </dialog>
